<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Semantic Review Search | MoodMeter
    </title>

    <link
        rel="stylesheet"
        href="/static/styles.css"
    >

</head>


<body>

    <header class="topbar">

        <div class="topbar-content">

            <div class="brand">

                <h1>
                    MoodMeter
                </h1>

                <p>
                    Evidence-Based Consumer Reviews
                </p>

            </div>


            <nav class="navigation">

                <a
                    href="/businesses-page"
                    class="nav-link"
                >
                    Businesses
                </a>

                <a
                    href="/"
                    class="nav-link"
                >
                    Write a Review
                </a>

                <a
                    href="/account"
                    class="nav-link"
                >
                    My Account
                </a>

            </nav>

        </div>

    </header>


    <main class="page">

        <section class="card">

            <div class="section-heading">

                <h2>
                    Semantic Review Search
                </h2>

                <p>
                    Search verified MoodMeter reviews
                    by meaning using stored review
                    embeddings.
                </p>

            </div>


            <div class="field">

                <label for="business-id">
                    Business ID
                </label>

                <input
                    type="number"
                    id="business-id"
                    min="1"
                    required
                >

            </div>


            <div class="field">

                <label for="semantic-question">
                    Question
                </label>

                <textarea
                    id="semantic-question"
                    placeholder="What are customers saying about customer service?"
                    required
                ></textarea>

            </div>


            <div class="field">

                <label for="semantic-limit">
                    Reviews to Retrieve
                </label>

                <select id="semantic-limit">

                    <option value="3">
                        3
                    </option>

                    <option
                        value="5"
                        selected
                    >
                        5
                    </option>

                    <option value="10">
                        10
                    </option>

                </select>

            </div>


            <button
                type="button"
                id="semantic-search-button"
                class="primary-button"
            >
                Search Reviews
            </button>


            <p
                id="semantic-search-status"
                class="status-message"
            >
            </p>

        </section>


        <section
            id="semantic-results-section"
            class="card hidden"
        >

            <div class="section-heading">

                <h2>
                    Retrieved Reviews
                </h2>

                <p id="semantic-results-summary">
                </p>

            </div>


            <div id="semantic-results">
            </div>

        </section>

    </main>


    <script
        src="/static/semantic_search.js?v=1"
    ></script>

</body>

</html>
