<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MoodMeter Review Submission</title>

    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>

    <main class="container">

        <h1>MoodMeter</h1>

        <p>Submit a review with purchase evidence.</p>

        <form id="review-form">

            <label for="token">
                Authentication Token
            </label>

            <input
                type="text"
                id="token"
                required
            >

            <label for="business-id">
                Business ID
            </label>

            <input
                type="number"
                id="business-id"
                min="1"
                required
            >

            <label for="rating">
                Rating
            </label>

            <select id="rating" required>
                <option value="">Select a rating</option>
                <option value="1">1 Star</option>
                <option value="2">2 Stars</option>
                <option value="3">3 Stars</option>
                <option value="4">4 Stars</option>
                <option value="5">5 Stars</option>
            </select>

            <label for="review-body">
                Review
            </label>

            <textarea
                id="review-body"
                required
            ></textarea>

            <label for="receipt">
                Receipt
            </label>

            <input
                type="file"
                id="receipt"
                accept="image/jpeg,image/png,image/webp"
                required
            >

            <label for="purchase-images">
                Purchase Evidence
            </label>

            <input
                type="file"
                id="purchase-images"
                accept="image/jpeg,image/png,image/webp"
                multiple
                required
            >

            <button type="submit">
                Submit Review
            </button>

        </form>

        <p id="status"></p>

    </main>

    <script src="/static/app.js"></script>

</body>

</html>
